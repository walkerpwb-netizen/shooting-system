<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#031c18">
  <meta name="robots" content="noindex,nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Prace serwisowe | System Strzelecki</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at top, #104b3d, #031c18 70%); color: #ecfdf5; font-family: system-ui, sans-serif; }
    main { width: 100%; max-width: 560px; padding: clamp(28px, 6vw, 52px); border: 1px solid #28715a; border-radius: 24px; background: #062b24; text-align: center; box-shadow: 0 24px 80px #0004; }
    .brand { color: #a7f3d0; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .symbol { display: grid; place-items: center; width: 72px; height: 72px; margin: 32px auto 24px; border: 1px solid #4b9976; border-radius: 50%; color: #bbf7d0; font-size: 36px; }
    h1 { margin: 0 0 20px; font-size: clamp(28px, 6vw, 36px); line-height: 1.2; }
    p { margin: 12px 0; line-height: 1.7; color: #cde9df; }
    .note { margin-top: 28px; font-size: 14px; color: #97c7b3; }
    button { margin-top: 20px; border: 1px solid #86efac; border-radius: 12px; background: #bbf7d0; color: #052e16; padding: 13px 22px; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
  </style>
  <script src="/maintenance/recovery.js" defer></script>
</head>
<body>
  <main>
    <div class="brand">System Strzelecki</div>
    <div class="symbol" aria-hidden="true">⚒</div>
    <h1>Trwają prace serwisowe</h1>
    <p>Wprowadzamy zmiany w Systemie Strzeleckim.<br>Zapraszamy ponownie później.</p>
    <p>Dziękujemy za cierpliwość.</p>
    <button type="button" id="retry">Sprawdź ponownie</button>
    <p class="note" id="status" role="status">Aplikacja wróci automatycznie, gdy zakończymy prace.</p>
    <noscript><p>Po zakończeniu prac odśwież stronę, aby wrócić do aplikacji.</p></noscript>
  </main>
</body>
</html>

error_page 503 =503 $shooting_maintenance_response;

if ($shooting_maintenance_blocked) {
    return 503;
}

location = /maintenance/status {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 200 '{"enabled":$shooting_maintenance_enabled,"restricted":$shooting_maintenance_restricted}';
}

location = /maintenance/recovery.js {
    alias /var/lib/shooting-system/maintenance/public/recovery.js;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

location = /maintenance/page.html {
    internal;
    alias /var/lib/shooting-system/maintenance/public/index.html;
    types { }
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;
    add_header X-Maintenance-Mode "1" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; frame-ancestors 'self'; form-action 'none'" always;
}

location @shooting_maintenance_api {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;
    add_header X-Maintenance-Mode "1" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 503 '{"detail":"Trwają prace serwisowe. Zapraszamy ponownie później.","maintenance":true}';
}

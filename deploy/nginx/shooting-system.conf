include /etc/nginx/snippets/shooting-maintenance-http.conf;

# Original path survives internal maintenance redirects; never log query tokens here.
map $request_uri $shooting_log_path {
    ~^([^?]*) $1;
}

# Use the original path: internal error_page redirects change $uri and volatile maps.
map "$shooting_maintenance_restricted:$request_method:$shooting_log_path" $shooting_log_maintenance_blocked {
    default 0;
    ~^1:(GET|HEAD):/maintenance/(status|recovery\.js|page\.html)$ 0;
    ~^1:POST:/api/premium/autopay/production/itn$ 0;
    ~^1: 1;
}

log_format shooting_bots escape=json
    '{"schema":1,"time":"$time_iso8601","host":"$host",'
    '"http_host":"$http_host","server_name":"$server_name","scheme":"$scheme",'
    '"ip":"$remote_addr","method":"$request_method","path":"$shooting_log_path",'
    '"status":$status,"bytes":$body_bytes_sent,"request_time":"$request_time",'
    '"upstream_status":"$upstream_status","ua":"$http_user_agent",'
    '"maintenance":"$shooting_maintenance_enabled",'
    '"maintenance_blocked":"$shooting_log_maintenance_blocked"}';

server {
    # Keep combined logging for existing consumers and add host-aware JSON.
    access_log /var/log/nginx/access.log combined;
    access_log /var/log/nginx/shooting-bots.log shooting_bots;
    listen 80;
    server_name www.system-strzelecki.pl;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=(), fullscreen=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://pay.autopay.eu; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://system-strzelecki.pl https://www.system-strzelecki.pl https://*.tile.openstreetmap.org https://server.arcgisonline.com https://fbcdn.net https://*.fbcdn.net https://cdninstagram.com https://*.cdninstagram.com data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
    return 308 https://system-strzelecki.pl$request_uri;
}


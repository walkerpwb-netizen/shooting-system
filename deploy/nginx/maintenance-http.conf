# Included in the http context by shooting-system.conf. State survives deploys.
include /var/lib/shooting-system/maintenance/state.conf;

map "$shooting_maintenance_enabled:$shooting_maintenance_allowed" $shooting_maintenance_restricted {
    default 0;
    "1:0" 1;
}

# Exempt only these exact paths and methods. No exemption for ordinary API calls.
map "$request_method:$uri" $shooting_maintenance_exempt {
    volatile;
    default 0;
    ~^(GET|HEAD):/maintenance/status$ 1;
    ~^(GET|HEAD):/maintenance/recovery.js$ 1;
    ~^(GET|HEAD):/maintenance/page.html$ 1;
    ~^POST:/api/premium/autopay/(sandbox/|production/)?itn$ 1;
}

map "$shooting_maintenance_restricted:$shooting_maintenance_exempt" $shooting_maintenance_blocked {
    volatile;
    default 0;
    "1:0" 1;
}

# API callers receive JSON, browsers receive the standalone HTML page.
map $uri $shooting_maintenance_response {
    default /maintenance/page.html;
    ~^/api/ @shooting_maintenance_api;
}

name: CI and Production Deploy

on:
  push:
    branches:
      - main
      - env-config
  pull_request:
    branches:
      - main
      - env-config
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: /api
      API_URL: http://127.0.0.1:8000

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shooting_ci
          POSTGRES_USER: shooting_ci
          POSTGRES_PASSWORD: shooting_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shooting_ci -d shooting_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg2://shooting_ci:shooting_ci@127.0.0.1:5432/shooting_ci
      SECRET_KEY: ci-secret-key
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Compile backend sources
        run: python -m compileall .

      - name: Verify Alembic migrations
        run: alembic -c alembic.ini upgrade head

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    if: >-
      github.ref == 'refs/heads/env-config' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    environment: production

    steps:
      - name: Prepare SSH key
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key

      - name: Trust production host key
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
        run: ssh-keyscan -p "${PRODUCTION_SSH_PORT:-22}" -H "$PRODUCTION_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Run production deploy script
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          ssh -p "${PRODUCTION_SSH_PORT:-22}" \
            -i ~/.ssh/production_key \
            -o IdentitiesOnly=yes \
            "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            'DEPLOY_BRANCH=env-config /home/ubuntu/shooting-system/deploy/scripts/deploy-production.sh'
